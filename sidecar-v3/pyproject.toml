[project]
name = "legend-lore-sidecar-v3"
version = "0.0.0"
description = "v3 retrieval pipeline for Legend Lore — typed-IR ingestion, ONNX embed/rerank, SQLite store (skeleton until Phase 2)"
requires-python = ">=3.12"
# Loose bounds while this is a skeleton — the Phase 1 spikes pin the exact
# layout model, embedder ONNX export, and vector engine before anything is
# locked. No PyTorch, ever (constitution #1: ONNX only).
dependencies = [
    "pymupdf>=1.24",
    "numpy>=1.26",
    "pillow>=10.0",
    "onnxruntime>=1.18",
    "apsw>=3.46",          # SQLite w/ loadable extensions (stdlib sqlite3 lacks it on macOS)
    "sqlite-vec>=0.1.6",   # vector store: binary-quant prefilter + f32 rescore
    "tokenizers>=0.20",    # bge-m3 tokenizer (Rust, no PyTorch — constitution #1)
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pyyaml>=6.0",   # the eval harness (evals/) loads golden/query YAML when driving v3
]

# Run modules directly (python -m ...), same as sidecar/; not an installed package.
[tool.uv]
package = false
