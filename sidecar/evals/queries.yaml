# Pre-registered retrieval queries — ground truth for the eval harness.
#
# Ported from unseen-servant-spikes/hybrid_retrieval_spike/queries.yaml
# (30 locked chunker_spike queries + 10 cross-system queries), keeping the
# GT-fixed page ranges. New in this port: per-query `answer` anchors so the
# scorer grades on the specific answer chunk instead of page overlap (see
# evals/README.md and docs/roadmap/2026-07-09-search-quality-goal.md).
# Lines marked "GT-fix (port)" add page ranges where locating the literal
# answer text showed it lives outside the originally declared range — same
# practice as the spike's own GT-fixes.
#
# Fields:
#   text     — the query, verbatim from the spike (locked; do not edit)
#   source   — PDF filename prefix, or `any` (no source filter at search time)
#   pages    — 1-indexed physical page range(s); `|` separates alternatives
#   category — stat_block | table | prose | cross_page | cross_system
#   answer   — anchors that must ALL appear in the retrieved chunk text after
#              normalization (lowercase, punctuation/layout collapsed to
#              single spaces). A list element that is itself a list means
#              "any one of these alternatives". Anchors are verbatim phrases
#              from the answer passage in the source PDF. Some alternatives
#              encode extraction artifacts (table cells losing spaces, e.g.
#              "1d6 or byweapon") — calibrated against the indexed chunks.

queries:
  # ───────── Basic-Fantasy-RPG-Rules-r142.pdf ─────────
  - text: "Hit dice and armor class of a Cloud Dragon"
    source: Basic-Fantasy
    pages: "85-86"
    category: stat_block
    answer: [["dragon cloud", "cloud dragon"], "armor class 22", "hit dice 11"]
  - text: "What is the morale and number appearing of a skeleton"
    source: Basic-Fantasy
    pages: "135-145|149-149"
    category: stat_block
    answer: ["skeleton", ["3d6 wild 3d10", "morale 12"]]
  - text: "Goblin attack bonus and damage"
    source: Basic-Fantasy
    pages: "115-130|108-109"
    category: stat_block
    answer: ["goblin", ["1d6 or by weapon", "1d6 or byweapon"]]
  - text: "Giant rat hit dice and save as"
    source: Basic-Fantasy
    pages: "110-140"
    category: stat_block
    answer: [["rat and rat giant", "giant rat", "rat giant"], ["1d4 hit points", "1d4 hitpoints"]]

  - text: "Cloud Dragon age category breath weapon dimensions"
    source: Basic-Fantasy
    pages: "85-85"
    category: table
    answer: ["cloud dragon age table", "age category"]
  - text: "Movement rate for medium load beast of burden horse"
    source: Basic-Fantasy
    pages: "67-67"
    category: table
    answer: [["riding horse", "draft horse", "war horse"], ["light load", "heavy load"]]
  - text: "Armor class bonus and weight for chain mail"
    source: Basic-Fantasy
    pages: "40-55|15-15"
    category: table
    answer: ["chain mail", ["60 gp", "60gp"]]
  - text: "Thief skill percentages at level 3"
    source: Basic-Fantasy
    pages: "15-30|13-14"
    category: table
    answer: ["thief abilities", "open locks"]
  - text: "Cleric saving throws at level 5"
    source: Basic-Fantasy
    pages: "10-30|65-65"                      # GT-fix (port): 'Saving Throw Tables by Class' is at p65
    category: table
    answer: ["cleric", "death ray or poison"]
  - text: "Experience needed to reach fighter level 4"
    source: Basic-Fantasy
    pages: "10-30"
    category: table
    answer: ["fighter", "8 000"]              # Fighter table p11: level 4 = 8,000 XP

  - text: "How does surprise work in combat"
    source: Basic-Fantasy
    pages: "54-75"
    category: prose
    answer: ["surprised on a roll of 1 2"]
  - text: "What happens when a character reaches zero hit points"
    source: Basic-Fantasy
    pages: "55-75"
    category: prose
    answer: ["0 hit points is generally dead"]
  - text: "Rules for climbing and falling damage"
    source: Basic-Fantasy
    pages: "60-80"
    category: prose
    answer: ["falling damage", "1d6 points of damage per 10"]
  - text: "How to resolve a saving throw against petrification"
    source: Basic-Fantasy
    pages: "55-75"
    category: cross_page
    answer: ["paralysis or petrify", "saving throw"]

