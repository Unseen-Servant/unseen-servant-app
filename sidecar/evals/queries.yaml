    category: prose
    answer: ["determining initiative order"]
  - text: "Range and damage of a longbow"
    source: Black-Flag
    pages: "50-90|139-139|298-298"
    category: table
    answer: ["longbow", ["1d8 piercing", "range 150 600", "150 600 ft"]]
  - text: "Languages available to a half-elf"
    source: Black-Flag
    pages: "20-60|62-63"                      # GT-fix (port): no half-elf in Black Flag; heritage Languages traits are at p62-63
    category: cross_page
    answer: ["languages", "you know common and"]
  - text: "How does the ranger's favored enemy feature work"
    source: Black-Flag
    pages: "20-60"
    category: prose
    answer: ["favored foe", "choose a type of enemy"]

