[project]
name = "legend-lore-sidecar"
version = "0.1.0"
description = "PDF indexing and semantic search sidecar for Legend Lore"
requires-python = ">=3.12"
dependencies = [
    "pymupdf4llm==1.28.2",
    "fastapi==0.159.1",
    "uvicorn==0.54.0",
    "python-multipart==0.0.32",
    "mcp==2.3.0",
    "httpx==0.28.1",
    "fastembed==0.9.0",
    "symspellpy==6.10.0",
    "sqlite-vec==0.1.9",
    "numpy==2.5.4",
    "watchfiles==1.3.0",
    "pyyaml==6.0.3",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "reportlab>=4.5.1",
]
build = [
    "pyinstaller>=6.0",
]

# server.py and mcp_server.py are run directly, not installed as a package.
[tool.uv]
package = false
