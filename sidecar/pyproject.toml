[project]
name = "legend-lore-sidecar"
version = "0.1.0"
description = "PDF indexing and semantic search sidecar for Legend Lore"
requires-python = ">=3.12"
dependencies = [
    "chromadb==1.5.9",
    "pymupdf4llm==1.28.0",
    "ollama==0.6.2",
    "fastapi==0.141.1",
    "uvicorn==0.52.1",
    "python-multipart==0.0.32",
    "mcp==1.28.1",
    "httpx==0.28.1",
    "fastembed==0.8.0",
    "symspellpy==6.10.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "reportlab>=4.5.1",
]
build = [
    "pyinstaller>=6.0",
]

# server.py and mcp_server.py are run directly, not installed as a package.
[tool.uv]
package = false
