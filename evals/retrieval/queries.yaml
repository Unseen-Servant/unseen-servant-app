# Phase 0 retrieval suite (v3 scaffold §3) — scope-aware.
#
# Each query names a `scope` that decides how it is searched AND graded,
# matching how Unseen Servant is actually used:
#   single — GM has a book selected. Search is filtered to `doc`'s file;
#            relevance = anchors only (the filter guarantees the system).
#   cued   — "swimming mechanics dragonbane": the query NAMES the system.
#            Search is unfiltered; relevance = anchors AND the right file —
#            the right system must beat other-system-same-topic and
#            same-system-other-topic. Target single-file systems so doc-match
#            is system-match.
#   uncued — ambiguous search, no system named. Unfiltered; relevance =
#            anchors, ANY file (a correct answer from any system counts).
#            `doc`/`answer_ref` are a representative for verify only.
#
# Fields: pair, style (keyword|nl), scope, category, query, doc, answer_ref,
# anchors (all outer must hit; inner list = any-of), pages (secondary).
# Every anchor is verified in ref ∧ PDF by verify_anchors.py. Table-cell
# anchors use any-of for spacing (raw PDF "60 gp" vs v2 markdown "60gp").

# ═══════════════════════════ SINGLE (filtered to one file) ═══════════════════════════
