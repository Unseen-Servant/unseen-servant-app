# First eval query set — Phase 0 retrieval suite (v3 scaffold §3).
#
# 10 intent pairs (keyword + nl style) = 20 queries, across 5 categories.
# Every anchor is verified in BOTH the digital-native reference and the PDF
# by evals/retrieval/verify_anchors.py — do not hand-edit anchors without
# re-running it (the old GT was once 30% wrong).
#
# Fields (schema: v3 scaffold §3):
#   pair       — keyword+nl forms of one intent share this key
#   style      — keyword | nl (separately scored)
#   category   — exact_name | table_lookup | prose_rule | cross_page
#                | paraphrase_control   (oov_homebrew deferred: needs a
#                homebrew PDF with invented proper nouns, not yet in corpus)
#   doc        — id from corpus.manifest.json
#   answer_ref — canonical source file (provenance + verify target)
#   anchors    — all outer must hit; an inner list means any-of
#   pages      — physical PDF page(s), secondary check only
#
# NOTE: OSRIC's first reference capture was JS-rendered nav shells with no
# rule text; replaced 2026-08-14 with 6 osric_chapter*.html files carrying
# full rules (manifest digest re-pinned). OSRIC is the hardest-extraction
# book, so it is over-weighted here per §3.

