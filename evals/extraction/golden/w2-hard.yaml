# Golden page specs — round two: the pages extraction actually fails on.
#
# phase0.yaml covers all 7 systems and is saturated (v3 W1 scores 1.000 /
# 1.000 / 0.982), so it can only detect regressions on layouts it already
# holds. These 14 pages were selected from the two committed corpus-QA
# baselines by layout pathology — broken native blocks, displaced adjacency —
# excluding the 40 already specced, capped at 4 per book so the set does not
# become an OSRIC regression test.
#
# Same contract as phase0.yaml: every phrase is verified by verify_golden.py
# in BOTH the reference and the raw PDF page. Fragments in `order` span the
# left column and then the right, so a column interleave registers as an
# inversion — the failure mode that shipped three times as a GO.
#
# Note on phrasing: several of these PDFs break words at ligatures ("fi nd",
# "ﬂ ame") or soft-hyphenate across lines ("arche­ type"). normalize() splits
# on every non-alphanumeric, so those words can never match — phrases here
# avoid them deliberately.
#
# Measured 2026-08-31 against v2, v3/pymupdf and v3/pdfium. Four pages separate
# the configs today — h03 (pdfium order 0.667), h04 (v2 content 0.750, cells
# 0.800), h10 (v2 0.833 / pdfium 0.667), h14 (v2 0.700 / pdfium 0.900). The
# other ten score 1.000 everywhere: they are tripwires, not separators, and
# gate.py is per-page, so they cost the gate nothing and fail the moment
# anything breaks them. Neither corpus-QA block damage nor a multi-column
# layout statistic predicted which pages would separate — the four winners rank
# LOW on both. Discrimination was found by authoring and measuring, ~30% yield.

