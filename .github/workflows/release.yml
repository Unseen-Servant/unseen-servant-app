name: Release

on:
  push:
    # Semver release tags only (vX.Y.Z). Milestone tags like `v3-phase-0`
    # deliberately don't match, so they don't trigger a cross-platform build.
    tags: ['v[0-9]*.[0-9]*.[0-9]*']

jobs:
  build-macos:
    runs-on: macos-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: sidecar/uv.lock

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      # Reuse the PyInstaller output across runs of the same tag (e.g. a
      # re-tagged draft whose follow-up fix only touched Rust/frontend).
      # Any change to deps, bundled sidecar source, or this recipe busts it.
      - name: Cache sidecar binaries
        id: sidecar-dist
        uses: actions/cache@v6
        with:
          path: sidecar/dist
          key: sidecar-dist-${{ runner.os }}-${{ hashFiles('sidecar/uv.lock', 'sidecar/*.py', 'sidecar/legend_lore/**/*.py', '.github/workflows/release.yml') }}

      - name: Install Python dependencies and PyInstaller
        if: steps.sidecar-dist.outputs.cache-hit != 'true'
        # uv's own Python, not the runner's python.org framework build: that
        # one's sqlite3 lacks enable_load_extension, so the bundled sidecar
        # can't load sqlite-vec and dies at startup.
        env:
          UV_PYTHON_PREFERENCE: only-managed
        run: |
          cd sidecar
          uv sync --frozen --group build

      - name: Build sidecar binaries
        if: steps.sidecar-dist.outputs.cache-hit != 'true'
        run: |
          cd sidecar
          # --collect-all pulls in submodules + binaries + data files:
          #  - pymupdf{,4llm}: ONNX layout-analyzer YAML/weights at
          #    pymupdf/layout/resources/
          #  - fastembed: cross-encoder ONNX model + tokenizer assets
          #    used by the reranker
          #  - symspellpy: frequency_dictionary_en_82_765.txt, read at
          #    runtime by spelling.py's general-English guard — pure-Python
          #    module, but the data file is not collected on its own
          #  - sqlite_vec: the vec0 loadable extension the library store
          #    loads at startup; sqlite_vec.load() finds it next to the
          #    package's __init__
          # Kept in sync with scripts/build-sidecar.sh.
          uv run --frozen --no-sync pyinstaller --onefile --name legend-lore-sidecar server.py \
            --collect-all pymupdf \
            --collect-all pymupdf4llm \
            --collect-all fastembed \
            --collect-all symspellpy \
            --collect-all sqlite_vec \
            --hidden-import uvicorn.logging \
            --hidden-import uvicorn.protocols.http \
            --hidden-import uvicorn.protocols.http.auto \
            --hidden-import uvicorn.protocols.http.h11_impl \
            --hidden-import uvicorn.protocols.http.httptools_impl \
            --hidden-import uvicorn.protocols.websockets \
            --hidden-import uvicorn.protocols.websockets.auto \
            --hidden-import uvicorn.protocols.websockets.wsproto_impl \
            --hidden-import uvicorn.protocols.websockets.websockets_impl \
            --hidden-import uvicorn.lifespan \
            --hidden-import uvicorn.lifespan.on \
            --hidden-import uvicorn.lifespan.off \
            --noconfirm --clean
          uv run --frozen --no-sync pyinstaller --onefile --name legend-lore-mcp mcp_server.py \
            --hidden-import mcp.server.fastmcp \
            --noconfirm --clean

      - name: Place sidecar binaries for Tauri
        run: |
          TRIPLE=$(rustc -vV | grep host | cut -d' ' -f2)
          mkdir -p src-tauri/binaries
          cp sidecar/dist/legend-lore-sidecar "src-tauri/binaries/legend-lore-sidecar-${TRIPLE}"
          cp sidecar/dist/legend-lore-mcp "src-tauri/binaries/legend-lore-mcp-${TRIPLE}"

      # The bundled ACKNOWLEDGEMENTS.txt lists this platform's Python
      # packages. uv run syncs the sidecar env when the cache hit above
      # skipped it.
      - name: Generate acknowledgements
        env:
          UV_PYTHON_PREFERENCE: only-managed
        run: uv run --frozen --project sidecar --group build python scripts/acknowledgements.py

      - name: Set up signing keychain
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          # Import certificate into a temporary keychain. Tauri picks it up
          # during `tauri build` and deep-signs the whole bundle — including
          # the sidecar binaries in Contents/MacOS/ — with the entitlements
          # from bundle.macOS.entitlements, so no pre-signing loop is needed.
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          KEYCHAIN_PASSWORD=$(openssl rand -base64 32)
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          echo "$APPLE_CERTIFICATE" | base64 --decode > $RUNNER_TEMP/certificate.p12
          security import $RUNNER_TEMP/certificate.p12 -P "$APPLE_CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain-db

      - name: Build Tauri app
        timeout-minutes: 20
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: npm run tauri build

      - name: Rename artifacts
        run: |
          mkdir -p release-artifacts
          for f in src-tauri/target/release/bundle/dmg/*.dmg; do
            name=$(basename "$f" | sed 's/Unseen Servant/Unseen-Servant/')
            cp "$f" "release-artifacts/$name"
          done

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            release-artifacts/*.dmg
          generate_release_notes: true
          draft: true

  build-windows:
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: sidecar/uv.lock

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      # Reuse the PyInstaller output across runs of the same tag (e.g. a
      # re-tagged draft whose follow-up fix only touched Rust/frontend).
      # Any change to deps, bundled sidecar source, or this recipe busts it.
      - name: Cache sidecar binaries
        id: sidecar-dist
        uses: actions/cache@v6
        with:
          path: sidecar/dist
          key: sidecar-dist-${{ runner.os }}-${{ hashFiles('sidecar/uv.lock', 'sidecar/*.py', 'sidecar/legend_lore/**/*.py', '.github/workflows/release.yml') }}

      - name: Install Python dependencies and PyInstaller
        if: steps.sidecar-dist.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          cd sidecar
          uv sync --frozen --group build

      - name: Build sidecar binaries
        if: steps.sidecar-dist.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          cd sidecar
          uv run --frozen --no-sync pyinstaller --onefile --name legend-lore-sidecar server.py `
            --collect-all pymupdf `
            --collect-all pymupdf4llm `
            --collect-all fastembed `
            --collect-all symspellpy `
            --collect-all sqlite_vec `
            --hidden-import uvicorn.logging `
            --hidden-import uvicorn.protocols.http `
            --hidden-import uvicorn.protocols.http.auto `
            --hidden-import uvicorn.protocols.http.h11_impl `
            --hidden-import uvicorn.protocols.http.httptools_impl `
            --hidden-import uvicorn.protocols.websockets `
            --hidden-import uvicorn.protocols.websockets.auto `
            --hidden-import uvicorn.protocols.websockets.wsproto_impl `
            --hidden-import uvicorn.protocols.websockets.websockets_impl `
            --hidden-import uvicorn.lifespan `
            --hidden-import uvicorn.lifespan.on `
            --hidden-import uvicorn.lifespan.off `
            --noconfirm --clean
          uv run --frozen --no-sync pyinstaller --onefile --name legend-lore-mcp mcp_server.py `
            --hidden-import mcp.server.fastmcp `
            --noconfirm --clean

      - name: Place sidecar binaries for Tauri
        shell: pwsh
        run: |
          $triple = (rustc -vV | Select-String "host:").ToString().Split(" ")[1]
          New-Item -ItemType Directory -Force -Path src-tauri\binaries
          Copy-Item sidecar\dist\legend-lore-sidecar.exe "src-tauri\binaries\legend-lore-sidecar-$triple.exe"
          Copy-Item sidecar\dist\legend-lore-mcp.exe "src-tauri\binaries\legend-lore-mcp-$triple.exe"

      # Lists this platform's Python packages (pywin32 only here).
      - name: Generate acknowledgements
        run: uv run --frozen --project sidecar --group build python scripts/acknowledgements.py

      - name: Build Tauri app
        run: npm run tauri build

      - name: Rename artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release-artifacts
          Get-ChildItem src-tauri\target\release\bundle\nsis\*.exe | ForEach-Object {
            $name = $_.Name -replace 'Unseen Servant', 'Unseen-Servant'
            Copy-Item $_.FullName "release-artifacts\$name"
          }

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            release-artifacts/*
          generate_release_notes: true
          draft: true
