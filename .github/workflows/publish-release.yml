name: Publish release to R2

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to (re)publish to R2 (e.g. v2.0.1)"
        required: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      AWS_ACCESS_KEY_ID:     ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION:    auto
      R2_ENDPOINT:           https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
      R2_BUCKET:             ${{ secrets.R2_BUCKET }}
      TAG:                   ${{ github.event.release.tag_name || github.event.inputs.tag }}
      PUBLIC_BASE:           https://downloads.unseenservant.games/legend-lore

    steps:
      - uses: actions/checkout@v7

      - name: Resolve version from tag
        run: |
          VERSION="${TAG#v}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Download release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p assets
          gh release download "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "*.dmg" \
            --pattern "*-setup.exe" \
            --dir ./assets
          ls -la assets

      - name: Identify asset filenames
        run: |
          MACOS_FILE=$(ls assets/*.dmg | head -n1 | xargs -n1 basename)
          WINDOWS_FILE=$(ls assets/*-setup.exe | head -n1 | xargs -n1 basename)
          if [ -z "$MACOS_FILE" ] || [ -z "$WINDOWS_FILE" ]; then
            echo "Missing expected assets (need one .dmg and one -setup.exe)"
            exit 1
          fi
          echo "MACOS_FILE=$MACOS_FILE"     >> "$GITHUB_ENV"
          echo "WINDOWS_FILE=$WINDOWS_FILE" >> "$GITHUB_ENV"

      - name: Upload versioned (immutable) archive to R2
        run: |
          aws s3 cp "assets/$MACOS_FILE" \
            "s3://$R2_BUCKET/legend-lore/v$VERSION/Legend-Lore-$VERSION-macos.dmg" \
            --endpoint-url "$R2_ENDPOINT" \
            --cache-control "public, max-age=31536000, immutable"
          aws s3 cp "assets/$WINDOWS_FILE" \
            "s3://$R2_BUCKET/legend-lore/v$VERSION/Legend-Lore-$VERSION-windows.exe" \
            --endpoint-url "$R2_ENDPOINT" \
            --cache-control "public, max-age=31536000, immutable"

      - name: Upload latest/ to R2 (versioned filenames)
        run: |
          aws s3 cp "assets/$MACOS_FILE" \
            "s3://$R2_BUCKET/legend-lore/latest/Legend-Lore-$VERSION-macos.dmg" \
            --endpoint-url "$R2_ENDPOINT" \
            --cache-control "public, max-age=300"
          aws s3 cp "assets/$WINDOWS_FILE" \
            "s3://$R2_BUCKET/legend-lore/latest/Legend-Lore-$VERSION-windows.exe" \
            --endpoint-url "$R2_ENDPOINT" \
            --cache-control "public, max-age=300"

      - name: Write and upload version.json
        run: |
          RELEASED=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          cat > version.json <<EOF
          {
            "version": "$VERSION",
            "released": "$RELEASED",
            "downloads": {
              "macos":   "$PUBLIC_BASE/latest/Legend-Lore-$VERSION-macos.dmg",
              "windows": "$PUBLIC_BASE/latest/Legend-Lore-$VERSION-windows.exe"
            },
            "archive": {
              "macos":   "$PUBLIC_BASE/v$VERSION/Legend-Lore-$VERSION-macos.dmg",
              "windows": "$PUBLIC_BASE/v$VERSION/Legend-Lore-$VERSION-windows.exe"
            }
          }
          EOF
          cat version.json
          aws s3 cp version.json \
            "s3://$R2_BUCKET/legend-lore/version.json" \
            --endpoint-url "$R2_ENDPOINT" \
            --content-type "application/json" \
            --cache-control "no-cache"

      - name: Trigger Cloudflare Pages rebuild
        run: |
          curl -fsS -X POST "${{ secrets.CLOUDFLARE_PAGES_DEPLOY_HOOK }}"

      # Keeps this version and the one before on R2; prune-r2.yml runs the
      # same script by hand.
      - name: Prune old versions from R2
        run: bash scripts/prune-r2.sh
