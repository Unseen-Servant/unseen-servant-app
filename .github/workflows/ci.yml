name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  sidecar-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: sidecar/requirements-test.txt

      - name: Install dependencies
        run: |
          cd sidecar
          pip install -r requirements-test.txt

      - name: Run tests
        run: |
          cd sidecar
          pytest -v
