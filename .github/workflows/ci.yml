name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Cancel an in-progress PR run when a new commit lands on the same PR.
# Pushes to main aren't cancelled — those are the canonical post-merge
# validation, so the latest run for each commit must complete.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Detect which surfaces a PR actually touches so the expensive jobs
  # below can opt out when irrelevant. On push to main everything runs
  # so the post-merge state is fully validated regardless of which file
  # paths changed.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      sidecar: ${{ steps.filter.outputs.sidecar }}
      rust: ${{ steps.filter.outputs.rust }}
      frontend: ${{ steps.filter.outputs.frontend }}
      tauri_build: ${{ steps.filter.outputs.tauri_build }}
    steps:
      - uses: actions/checkout@v6
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            sidecar:
              - 'sidecar/**'
              - 'scripts/build-sidecar.sh'
            rust:
              - 'src-tauri/**'
            frontend:
              - 'src/**'
              - 'static/**'
              - 'package.json'
              - 'package-lock.json'
              - 'svelte.config.js'
              - 'vite.config.ts'
              - 'tsconfig.json'
            tauri_build:
              - 'src-tauri/**'
              - 'src/**'
              - 'static/**'
              - 'package.json'
              - 'package-lock.json'

  # Pure Python tests against the in-memory ChromaDB fixture. Fast,
  # exercises every endpoint contract.
  sidecar-tests:
    needs: changes
    if: needs.changes.outputs.sidecar == 'true' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: sidecar/requirements-test.txt

      - name: Install dependencies
        run: |
          cd sidecar
          pip install -r requirements-test.txt

      - name: Run tests
        run: |
          cd sidecar
          pytest -v

  # Rust formatting + lint + unit tests. Catches anything that would
  # break the Tauri compile or trip clippy. Uses Ubuntu because Tauri's
  # webkit deps install via apt; the Rust code is platform-independent.
  rust-checks:
    needs: changes
    if: needs.changes.outputs.rust == 'true' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Tauri Linux deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev

      - name: cargo fmt --check
        working-directory: src-tauri
        run: cargo fmt --all -- --check

      - name: cargo clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: cargo test
        working-directory: src-tauri
        run: cargo test --lib

  # svelte-check + vitest + production vite build. Covers TypeScript
  # errors, frontend unit tests, and any build-time regression.
  frontend-checks:
    needs: changes
    if: needs.changes.outputs.frontend == 'true' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: npm

      - name: npm ci
        run: npm ci

      - name: svelte-check
        run: npm run check

      - name: vitest
        run: npm test

      - name: vite build
        run: npm run build

  # Builds the PyInstaller sidecar binary and asserts it actually starts.
  # Would have caught #274 (missing pymupdf data files crashed the
  # bundled binary on import). Runs on macOS because that's the actual
  # distribution target and the build script is currently macOS-only;
  # the data-file bug it catches is platform-independent so one platform
  # is enough. Expensive (~10 min for PyInstaller) so we only run it
  # when sidecar code or the build script actually changed.
  sidecar-binary-smoke:
    needs: changes
    if: needs.changes.outputs.sidecar == 'true' || github.event_name == 'push'
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'

      - name: Build sidecar venv + install deps
        working-directory: sidecar
        run: |
          python -m venv .venv
          source .venv/bin/activate
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build PyInstaller binaries
        run: bash scripts/build-sidecar.sh

      - name: Sidecar binary --help
        run: |
          BIN=$(ls src-tauri/binaries/legend-lore-sidecar-*)
          echo "Smoke testing: $BIN"
          "$BIN" --help

      - name: MCP binary --help
        run: |
          BIN=$(ls src-tauri/binaries/legend-lore-mcp-*)
          echo "Smoke testing: $BIN"
          "$BIN" --help

  # Cross-platform Tauri compile on the actual distribution targets.
  # --no-bundle skips dmg/nsis packaging (slow and platform-fragile);
  # the goal here is to catch link errors and platform-specific Rust
  # issues, not to validate the bundler. Skipped for PRs that don't
  # touch any frontend/Rust code.
  tauri-build-smoke:
    needs: changes
    if: needs.changes.outputs.tauri_build == 'true' || github.event_name == 'push'
    strategy:
      fail-fast: false
      matrix:
        platform: [macos-latest, windows-latest]
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: npm

      - name: npm ci
        run: npm ci

      # tauri build expects the sidecar binaries to exist (they're a
      # bundle resource); empty placeholders are enough for --no-bundle
      # since that path skips resource copying. Touching the platform-
      # specific filenames keeps the resource glob happy on either OS.
      - name: Stub sidecar binaries
        shell: bash
        run: |
          mkdir -p src-tauri/binaries
          if [[ "${{ runner.os }}" == "macOS" ]]; then
            touch src-tauri/binaries/legend-lore-sidecar-aarch64-apple-darwin
            touch src-tauri/binaries/legend-lore-mcp-aarch64-apple-darwin
          else
            touch src-tauri/binaries/legend-lore-sidecar-x86_64-pc-windows-msvc.exe
            touch src-tauri/binaries/legend-lore-mcp-x86_64-pc-windows-msvc.exe
          fi

      - name: tauri build --no-bundle
        run: npm run tauri build -- --no-bundle
