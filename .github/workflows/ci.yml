name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# dorny/paths-filter calls the PR Files API to detect which surfaces a
# PR touches. The repo's default GITHUB_TOKEN doesn't grant that, so
# request it explicitly.
permissions:
  contents: read
  pull-requests: read

# Cancel an in-progress PR run when a new commit lands on the same PR.
# Pushes to main aren't cancelled — those are the canonical post-merge
# validation, so the latest run for each commit must complete.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Detect which surfaces a PR actually touches so the Linux jobs below
  # can opt out when irrelevant. On push to main everything runs so the
  # post-merge state is fully validated regardless of which file paths
  # changed. Cross-platform builds are NOT done here — release.yml
  # cross-compiles on tag push and is the canonical macOS/Windows gate.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      sidecar: ${{ steps.filter.outputs.sidecar }}
      rust: ${{ steps.filter.outputs.rust }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            sidecar:
              - 'sidecar/**'
              - 'scripts/build-sidecar.sh'
            rust:
              - 'src-tauri/**'
            frontend:
              - 'src/**'
              - 'static/**'
              - 'package.json'
              - 'package-lock.json'
              - 'svelte.config.js'
              - 'vite.config.ts'
              - 'tsconfig.json'

  # Pure Python tests against the in-memory ChromaDB fixture. Fast,
  # exercises every endpoint contract.
  sidecar-tests:
    needs: changes
    if: needs.changes.outputs.sidecar == 'true' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: sidecar/uv.lock

      - name: Run tests
        run: |
          cd sidecar
          uv run --frozen pytest -v

  # Rust formatting + lint + unit tests. Catches anything that would
  # break the Tauri compile or trip clippy. Uses Ubuntu because Tauri's
  # webkit deps install via apt; the Rust code is platform-independent.
  rust-checks:
    needs: changes
    if: needs.changes.outputs.rust == 'true' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Tauri Linux deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev

      - name: cargo fmt --check
        working-directory: src-tauri
        run: cargo fmt --all -- --check

      - name: cargo clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: cargo test
        working-directory: src-tauri
        run: cargo test --lib

  # svelte-check + vitest + production vite build. Covers TypeScript
  # errors, frontend unit tests, and any build-time regression.
  frontend-checks:
    needs: changes
    if: needs.changes.outputs.frontend == 'true' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: npm

      - name: npm ci
        run: npm ci

      - name: svelte-check
        run: npm run check

      - name: vitest
        run: npm test

      - name: vite build
        run: npm run build
